# Default values for notification-service-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

image:
  pullPolicy: IfNotPresent
  tag: "latest"

# Database configuration defaults
database:
  host: ""
  port: "5432"
  name: "db_logins"
  user: "postgres"
  passwordSecret:
    name: "postgresql-secret"
    key: "POSTGRES_PASSWORD"

# Dynatrace configuration defaults
dynatrace:
  networkZone: "dsa-notprod-acp-notprod-rtg-00"
  podRuntimeInjection:
    enabled: false
    volumeName: "oneagent"

nodeSelector: {}

tolerations: []

affinity: {}
