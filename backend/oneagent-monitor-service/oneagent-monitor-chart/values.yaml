replicaCount: 1

image:
  repository: "python"
  pullPolicy: IfNotPresent
  tag: "3.11-slim"

serviceAccount:
  create: false
  automount: true
  name: "default"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

environment:
  watchNamespace: "dsa-re-dev"

rbac:
  create: true
  clusterRoleName: "dsa-pod-patch"

nodeSelector: {}
tolerations: []
affinity: {}