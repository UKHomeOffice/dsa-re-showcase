replicaCount: 1

image:
  repository: "quay.io/ukhomeofficedigital/dsa-re-notification-service"
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: false
  automount: true
  name: "default"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

environment:
  watchNamespace: "dsa-re-dev"

nodeSelector: {}
tolerations: []
affinity: {}