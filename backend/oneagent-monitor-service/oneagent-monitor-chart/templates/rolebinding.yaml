{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oneagent-monitor-chart.fullname" . }}-rbac
  namespace: {{ .Values.environment.watchNamespace | default .Release.Namespace }}
  labels:
    {{- include "oneagent-monitor-chart.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name | default "default" }}
  namespace: {{ .Values.environment.watchNamespace | default .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRoleName | default "dsa-pod-patch" }}
{{- end }}