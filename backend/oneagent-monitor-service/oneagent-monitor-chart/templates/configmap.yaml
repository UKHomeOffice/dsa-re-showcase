apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oneagent-monitor-chart.fullname" . }}-script
  labels:
    {{- include "oneagent-monitor-chart.labels" . | nindent 4 }}
data:
  oneagent_monitor.py: |
    #!/usr/bin/env python3
    import os
    import time
    import logging
    import requests
    import threading
    import subprocess
    import json

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    class OneAgentMonitor:
        def __init__(self):
            self.namespace = os.getenv("WATCH_NAMESPACE", "dsa-re-dev")
            self.dt_api_url = os.getenv("DYNATRACE_METRICS_API_URL")
            self.dt_token = os.getenv("DYNATRACE_METRICS_TOKEN")
            self.uninstrumented_pods = set()
            self.last_api_success = time.time()
            
        def send_metric_to_dynatrace(self, metric_line):
            """Send metric to Dynatrace with fallback URLs"""
            urls = [
                self.dt_api_url,  # Internal ActiveGate
                "https://ewo35763.live.dynatrace.com/api/v2/metrics/ingest"  # External SaaS
            ]
            
            headers = {
                "Authorization": f"Api-Token {self.dt_token}",
                "Content-Type": "text/plain; charset=utf-8"
            }
            
            for url in urls:
                try:
                    response = requests.post(url, data=metric_line, headers=headers, verify=False, timeout=10)
                    if response.status_code == 202:
                        logger.info(f"SUCCESS: {metric_line.split(',')[0]}")
                        return True
                except Exception as e:
                    logger.error(f"Failed to send to {url}: {e}")
            return False

        def get_pods_via_kubectl(self):
            """Get pods using kubectl since kubernetes client isn't available"""
            try:
                result = subprocess.run(
                    ["kubectl", "get", "pods", "-n", self.namespace, "-o", "json"],
                    capture_output=True, text=True, timeout=30
                )
                if result.returncode == 0:
                    self.last_api_success = time.time()
                    return json.loads(result.stdout)
                else:
                    logger.error(f"kubectl failed: {result.stderr}")
                    return None
            except Exception as e:
                logger.error(f"Failed to get pods: {e}")
                return None

        def check_oneagent_status(self, pod):
            """Check OneAgent status using pod annotations"""
            annotations = pod.get("metadata", {}).get("annotations", {})
            status = annotations.get("dynatrace.com/oneagent-status", "not-attempted")
            
            if status == "instrumented":
                return None  # Successfully instrumented
            elif status == "failed":
                error = annotations.get("dynatrace.com/oneagent-error", "unknown")
                return f"failed_{error}"
            elif status == "attempting":
                return "attempting_instrumentation"
            else:
                return "not_attempted"

        def send_heartbeat(self):
            """Send heartbeat every 60 seconds"""
            while True:
                timestamp = int(time.time() * 1000)
                metric = f"ho.re.oneagent.monitor.heartbeat,namespace={self.namespace} 1 {timestamp}"
                self.send_metric_to_dynatrace(metric)
                time.sleep(60)

        def monitor_pods(self):
            """Monitor pods for OneAgent status"""
            logger.info(f"Starting OneAgent monitor for namespace: {self.namespace}")
            
            # Start heartbeat thread
            heartbeat_thread = threading.Thread(target=self.send_heartbeat, daemon=True)
            heartbeat_thread.start()
            
            while True:
                try:
                    # Get current pods
                    pods_data = self.get_pods_via_kubectl()
                    
                    if pods_data is None:
                        # API failure - send alert
                        timestamp = int(time.time() * 1000)
                        metric = f"ho.re.oneagent.monitor.api_failure,namespace={self.namespace} 1 {timestamp}"
                        self.send_metric_to_dynatrace(metric)
                        time.sleep(60)
                        continue
                    
                    # Check if API has been working
                    if time.time() - self.last_api_success > 300:  # 5 minutes
                        timestamp = int(time.time() * 1000)
                        metric = f"ho.re.oneagent.monitor.stream_stale,namespace={self.namespace} 1 {timestamp}"
                        self.send_metric_to_dynatrace(metric)
                    
                    current_uninstrumented = set()
                    
                    # Check each pod
                    for pod in pods_data.get("items", []):
                        if pod.get("status", {}).get("phase") != "Running":
                            continue
                            
                        pod_name = pod.get("metadata", {}).get("name")
                        status_type = self.check_oneagent_status(pod)
                        
                        if status_type:
                            pod_key = f"{self.namespace}/{pod_name}"
                            current_uninstrumented.add(pod_key)
                            
                            # Send event for new uninstrumented pods
                            if pod_key not in self.uninstrumented_pods:
                                timestamp = int(time.time() * 1000)
                                metric = f"ho.re.oneagent.pod.uninstrumented-Event,pod_name={pod_name},namespace={self.namespace},event_type=uninstrumented,uninstrumented_type={status_type} 1 {timestamp}"
                                self.send_metric_to_dynatrace(metric)
                                logger.warning(f"Uninstrumented pod detected: {pod_name} - {status_type}")
                    
                    # Update uninstrumented pods set
                    self.uninstrumented_pods = current_uninstrumented
                    
                    # Send gauge metric with current count
                    timestamp = int(time.time() * 1000)
                    count = len(self.uninstrumented_pods)
                    metric = f"ho.re.oneagent.pods.uninstrumented.gauge-count,namespace={self.namespace} {count} {timestamp}"
                    self.send_metric_to_dynatrace(metric)
                    
                    logger.info(f"Monitoring cycle completed. Found {count} uninstrumented pods.")
                    
                except Exception as e:
                    logger.error(f"Error in monitoring loop: {e}")
                
                time.sleep(30)  # Check every 30 seconds

    def main():
        monitor = OneAgentMonitor()
        monitor.monitor_pods()

    if __name__ == "__main__":
        main()
