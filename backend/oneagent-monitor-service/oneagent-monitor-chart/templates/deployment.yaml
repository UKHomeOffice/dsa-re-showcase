apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oneagent-monitor-chart.fullname" . }}
  labels:
    {{- include "oneagent-monitor-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "oneagent-monitor-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oneagent-monitor-chart.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - /tmp/oneagent_monitor.py
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Values.environment.watchNamespace | default .Release.Namespace }}
            - name: DYNATRACE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: registration-service-dynatrace-metrics-ingest
                  key: token
            - name: DYNATRACE_METRICS_API_URL
              valueFrom:
                secretKeyRef:
                  name: registration-service-dynatrace-metrics-ingest
                  key: api_url
          volumeMounts:
            - name: script
              mountPath: /tmp/oneagent_monitor.py
              subPath: oneagent_monitor.py
      volumes:
        - name: script
          configMap:
            name: {{ include "oneagent-monitor-chart.fullname" . }}-script
            defaultMode: 0755
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}