apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oneagent-monitor-chart.fullname" . }}-egress
  labels:
    {{- include "oneagent-monitor-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oneagent-monitor-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: dynatrace
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53