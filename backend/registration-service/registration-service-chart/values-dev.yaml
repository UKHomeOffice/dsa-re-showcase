namespaceToAllowEgress:
  - dynatrace

ipBlockToAllowEgress: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "dynatrace-oneagent-metadata-viewer"

service:
  type: ClusterIP
  port: 80

imagePullSecrets: []

dynatrace:
  podRuntimeInjection:
    enabled: true
  networkZone: "dsa-notprod-acp-notprod-rtg-00"

image:
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

kafka:
  keystore:
    location: "/etc/kafka-tls/kafka-client.2026-09-24/app-msk-kafka-client.p12"
    passwordSecret:
      name: "registration-service-kafka-keystore"
      key: "password"
    type: "PKCS12"
  truststore:
    passwordSecret:
      name: "registration-service-kafka-keystore"
      key: "truststore-password"


