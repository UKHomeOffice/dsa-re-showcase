# Default values for registration-service-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

image:
  pullPolicy: IfNotPresent
  tag: "latest"

# Database configuration defaults
database:
  secretName: "dsaredevshowcase-rds"
  nameOverride: ""

# Dynatrace configuration defaults
dynatrace:
  metricsSecretName: "registration-service-dynatrace-metrics-ingest"
  networkZone: "dsa-notprod-acp-notprod-rtg-00"
  podRuntimeInjection:
    enabled: false

# Environment configuration
environment: "dev"

# Kafka configuration
kafka:
  bootstrapServers: "b-1.dsaredevshowcase.rfkas2.c2.kafka.eu-west-2.amazonaws.com:9094,b-2.dsaredevshowcase.rfkas2.c2.kafka.eu-west-2.amazonaws.com:9094"
  topics:
    userLogin: "user-login"
    userRegistration: "user-registration"

# CronJob configuration
cronjob:
  enabled: false
  schedule: "*/10 * * * *"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 30
  image: "quay.io/ukhomeofficedigital/dsa-re-msk-cron:latest"
  registrationServiceUrl: "http://registration-service.dsa-re-dev.svc.cluster.local"

nodeSelector: {}

tolerations: []

affinity: {}
