---
namespaceToAllowEgress:
  - dynatrace

ipBlockToAllowEgress: []

serviceAccount:
  name: "dynatrace-oneagent-metadata-viewer"

service:
  port: 80

dynatrace:
  podRuntimeInjection:
    enabled: true
  networkZone: "dsa-preprod-acp-prod-rtg-00"

image:
  pullPolicy: Always

persistenceCredentialsSecretName: dsaredevshowcase-rds